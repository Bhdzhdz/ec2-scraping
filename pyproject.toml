[project]
name = "ec2-scraping"
version = "0.1.0"
description = "Geenerate an inventory of the ec2 instances on an aws account and get metadata from them "
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bernardo Hernandez Hernandez", email = "bhdzhdz@gmail.com" }]
dependencies = [
    "boto3>=1.43.114",
    "pymysql>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ec2_scraping"]

[dependency-groups]
dev = [
    "commitizen>=4.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=ec2_scraping --cov-report=term-missing"

[tool.coverage.run]
source = ["src/ec2_scraping"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true

[tool.ruff.lint.per-file-ignores]
"tests/schema/*" = ["E501", "PT018", "C408"]
