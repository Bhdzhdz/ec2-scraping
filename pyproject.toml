[project]
name = "ec2-scraping"
version = "0.1.0"
description = "Geenerate an inventory of the ec2 instances on an aws account and get metadata from them "
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Bernardo Hernandez Hernandez", email = "bhdzhdz@gmail.com" }]
dependencies = [
    "alembic>=1.13",
    "asyncssh>=2.14",
    "boto3>=1.43.114",
    "botocore>=1.35.0",
    "pymysql>=1.2.3",
    "sqlalchemy>=2.0",
]

[project.scripts]
ec2-scrape = "ec2_scraping.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ec2_scraping"]

[dependency-groups]
dev = [
    "commitizen>=4.0",
    "deptry>=0.20",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "pylint>=3.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "radon>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "vulture>=2.11",
    "xenon>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
output-format = "concise"

[tool.ruff.lint]
ignore = ["ANN401"]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "RUF",  # ruff-specific
    "PT",   # flake8-pytest-style
    "PL",   # pylint (refactor, structural limits, errors, warnings)
    "ERA",  # eradicate (no commented-out code)
    "ARG",  # flake8-unused-arguments
    "T20",  # flake8-print (no print in production code)
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations (require type annotations)
    "TC",   # flake8-type-checking (type-only imports)
    "PIE",  # flake8-pie
    "FURB", # refurb
    "PERF", # perflint
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 5
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
docstring-code-format = true

[tool.deptry]
extend_exclude = ["tests"]
known_first_party = ["ec2_scraping"]
ignore = ["DEP002"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
sort_by_size = true
ignore_decorators = ["@pytest.fixture"]

[tool.importlinter]
root_package = "ec2_scraping"

[[tool.importlinter.contracts]]
name = "No circular imports between sibling modules"
type = "acyclic_siblings"
ancestors = ["ec2_scraping"]

[tool.pylint.main]
files = ["src", "tests"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.reports]
score = false

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/ec2_scraping"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
